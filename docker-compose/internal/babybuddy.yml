services:
  babybuddy:
    image: lscr.io/linuxserver/babybuddy
    container_name: babybuddy
    networks:
      - devrack
    ports:
      - ${SERVER_IP}:7918:8000
    volumes:
      - /mnt/user/appdata/babybuddy:/config
    environment:
      CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8000,http://${SERVER_IP}:7918
      EMAIL_HOST: smtp.domain.tld
      EMAIL_PORT: <PORT>
      EMAIL_HOST_USER: email@domain.tld
      EMAIL_HOST_PASSWORD: "password"
      EMAIL_USE_TLS: True
      EMAIL_USE_SSL: False
      DEBUG: False
    labels:
      net.unraid.docker.managed: dockerman
      net.unraid.docker.webui: 'http://[IP]:[PORT:7918]'
      net.unraid.docker.icon: 'https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/baby-buddy.png'
    restart: unless-stopped

networks:
  devrack:
    name: ${DOCKER_NETWORK}
    external: true
