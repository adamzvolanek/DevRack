---
services:
  bookstack_db:
    image: ghcr.io/linuxserver/mariadb
    container_name: bookstack_db
    labels:
      net.unraid.docker.managed: dockerman
      net.unraid.docker.webui: 'http://[IP]:[PORT:3306]'
      net.unraid.docker.icon: 'https://cdn.jsdelivr.net/gh/selfhst/icons/webp/mariadb.webp'
    networks:
      - devrack
    ports:
      - "${SERVER_IP}:${BOOKSTACK_DB_PORT}:3306"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${BOOKSTACK_DB_PASSWORD}
      MYSQL_DATABASE: ${BOOKSTACK_DB_NAME}
      MYSQL_USER: ${BOOKSTACK_DB_USER}
      MYSQL_PASSWORD: ${BOOKSTACK_DB_PASSWORD}
      MYSQL_TCP_PORT: ${BOOKSTACK_DB_PORT}
    volumes:
      - /mnt/user/appdata/docs/bookstack/bookstack_db/config:/config
    restart: unless-stopped

  bookstack:
    image: ghcr.io/linuxserver/bookstack
    container_name: bookstack
    labels:
      net.unraid.docker.managed: dockerman
      net.unraid.docker.webui: 'http://[IP]:[PORT:3306]'
      net.unraid.docker.icon: 'https://cdn.jsdelivr.net/gh/selfhst/icons/webp/bookstack.webp'
    networks:
      - devrack
    ports:
      - "${SERVER_IP}:${BOOKSTACK_PORT}:80"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      APP_TIMEZONE: ${TZ}
      #APP_URL: http://${SERVER_IP}:${BOOKSTACK_PORT} # local
      APP_URL: https://docs.adamzvolanek.com # nginx hosted
      DB_HOST: bookstack_db
      DB_PORT: 3306
      DB_USER: ${BOOKSTACK_DB_USER}
      DB_PASS: ${BOOKSTACK_DB_PASSWORD}
      DB_DATABASE: ${BOOKSTACK_DB_NAME}
      # email
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_ENCRYPTION: tls
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      # The "from" email address for outgoing email
      MAIL_FROM: ${MAIL_FROM}
      # The "from" name used for outgoing email
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
    volumes:
      - /mnt/user/appdata/docs/bookstack/bookstack/config:/config
    restart: unless-stopped
    depends_on:
      - bookstack_db

networks:
  devrack:
    name: ${DOCKER_NETWORK}
    external: True
